name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          check-latest: false
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Validate BOM
        run: ./mvnw -f outcome-metrics-bom/pom.xml -B -ntp validate
      - name: Upload SBOM
        if: matrix.java == '25'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: "**/bom.json"
          if-no-files-found: error

  samples:
    name: Samples (JDK 21)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          check-latest: false
      - name: Install library modules
        # Build cache can skip install:install without writing to ~/.m2
        run: ./mvnw -B -ntp install -DskipTests -Dmaven.build.cache.enabled=false
      - name: Install BOM
        run: ./mvnw -f outcome-metrics-bom/pom.xml -B -ntp install -Dmaven.build.cache.enabled=false
      - name: Verify samples
        run: |
          VERSION="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          ./mvnw -f samples/pom.xml -B -ntp verify \
            -Doutcome-metrics.version="$VERSION" \
            -Dmaven.build.cache.enabled=false
