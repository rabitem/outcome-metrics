name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
      - name: Verify tag matches POM version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "$TAG" = "$POM"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path.home().joinpath(".m2/settings.xml").write_text(
              """
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>x-access-token</username>
                <password>{token}</password>
              </server>
            </servers>
          </settings>
          """.format(token=os.environ["GITHUB_TOKEN"])
          )
          PY
          ./mvnw -B -ntp -DskipTests deploy \
            "-DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
      - name: Collect GitHub Release artifacts
        run: |
          mkdir -p dist
          while IFS= read -r -d '' jar; do
            cp "$jar" dist/
          done < <(find . -path '*/target/outcome-metrics*.jar' -print0)
          ls -la dist
          test "$(ls -A dist)"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign artifacts (keyless cosign)
        run: |
          for artifact in dist/*; do
            case "$artifact" in
              *.sigstore.json) continue ;;
            esac
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - name: Extract changelog section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = Path("CHANGELOG.md").read_text()
          match = re.search(rf"## \[{re.escape(tag)}\].*?(?=\n## |\Z)", text, re.S)
          body = match.group(0).strip() if match else f"Release {tag}"
          Path("release-notes.md").write_text(body + "\n")
          PY
      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/*
