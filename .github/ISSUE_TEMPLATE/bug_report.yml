name: Bug report
description: Report a defect in outcome-metrics
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, use [private vulnerability reporting](https://github.com/rabitem/outcome-metrics/security/advisories/new) instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal example or stack trace
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Adapter / runtime
      options:
        - Core only
        - Spring Boot
        - Quarkus
        - Unsure
    validations:
      required: true
