# 18081 avoids clashing with common local listeners on 8081
quarkus.http.port=18081
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

outcome.metrics.enabled=true
outcome.metrics.annotation.enabled=true
outcome.metrics.max-meters=50000
outcome.metrics.cache.normalize-tags=true
outcome.metrics.tag-limits[0].meter-name-prefix=demo.shipment.
outcome.metrics.tag-limits[0].tag-key=carrier
outcome.metrics.tag-limits[0].maximum-values=8
